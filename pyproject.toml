[project]
name = "clinic-sms"
version = "0.1.0"
description = "Simulated-SMS clinic agent on livekit-agents: per-message cold starts, a resumable TaskGroup intake, handoffs, background jobs and record/replay"
readme = "README.md"
authors = [
    { name = "Richard" }
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "livekit-agents==1.8.11",
    "livekit-plugins-anthropic==1.8.11",
    "pydantic>=2",
]

[project.scripts]
clinic-sms = "clinic_sms.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 120
